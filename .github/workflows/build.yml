name: Build and release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: Linux
          - os: windows-2022
            platform: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Test directory iteration
        run: mise run test
      - name: Build and package 32-bit plugin
        env:
          RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
        run: mise exec -- python scripts/build.py --platform ${{ matrix.platform }} --version "${{ env.RELEASE_VERSION }}"
      - uses: actions/upload-artifact@v4
        with:
          name: FileManager-${{ matrix.platform }}
          path: build/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: FileManager-*
          merge-multiple: true
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --draft
          fi
          gh release upload "$RELEASE_TAG" dist/*.zip --clobber
          gh release edit "$RELEASE_TAG" --draft=false
